# Egress allowlist proxy. The OpenClaw container's only route out of its internal network.
# Domain-level allowlist: HTTPS is tunnelled with CONNECT and never decrypted, so the proxy
# sees the hostname but not the path. Anything not listed is denied and logged.

http_port 3128
visible_hostname egress-proxy
pid_filename /var/run/squid/squid.pid
cache deny all
cache_mem 0 MB
via off
forwarded_for delete
dns_v4_first on

# --- approved public sources -----------------------------------------------------------
acl approved_web dstdomain "/etc/squid/allowlist.txt"

# --- internal lab services (fixed host + port) ------------------------------------------
acl svc_crm   dstdomain crm
acl svc_model dstdomain model-relay
acl port_crm   port 8080
acl port_model port 11434

acl SSL_ports port 443
acl Web_ports port 80 443
acl CONNECT method CONNECT

# OpenClaw's managed proxy tunnels every request with CONNECT, plain http included, so CONNECT
# is allowed to the listed host:port pairs only (not to arbitrary ports).
http_access allow svc_crm port_crm
http_access allow svc_model port_model
http_access deny !Web_ports
http_access allow approved_web
http_access deny all

# One JSON line per request: time, client, method, host:port or URL, status, bytes.
logformat labjson {"ts":"%{%Y-%m-%dT%H:%M:%SZ}tg","client":"%>a","method":"%rm","url":"%ru","host":"%>rd","status":%>Hs,"squid":"%Ss","bytes":%<st}
access_log stdio:/logs/squid-access.jsonl labjson
cache_log stdio:/logs/squid-cache.log
logfile_rotate 0
